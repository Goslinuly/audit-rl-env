<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auditgym · обозреватель эпизодов</title>
  <meta name="description" content="RL-среда для ИИ-аудитора: синтетические компании, скрытые финансовые ошибки, эталон и доказательства.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 21l4-10 4 7 3-4 3 7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 21l4-10 4 7 3-4 3 7"/></svg>
        </div>
        <div>
          <div class="brand-name">auditgym</div>
          <div class="brand-sub">RL-среда для ИИ-аудитора</div>
        </div>
      </div>

      <section class="gen">
        <div class="section-title">Сгенерировать компанию</div>
        <label class="field">
          <span>Пресет</span>
          <select id="gen-preset"></select>
        </label>
        <label class="field">
          <span>Seed</span>
          <div class="seed-row">
            <input id="gen-seed" type="number" min="0" max="1000000000" value="42">
            <button class="icon-btn" id="gen-dice" title="Случайный seed" aria-label="Случайный seed">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/><circle cx="15.5" cy="8.5" r="1.4"/><circle cx="8.5" cy="15.5" r="1.4"/></svg>
            </button>
          </div>
        </label>
        <button class="btn primary wide" id="gen-go">Сгенерировать</button>
        <p class="hint">Тот же пресет и seed всегда дают ту же компанию — байт в байт.</p>
      </section>

      <nav class="episodes" id="episode-list" aria-label="Открытые эпизоды"></nav>
      <footer class="side-foot" id="side-foot"></footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menu-btn" aria-label="Меню">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="title-block">
          <h1 id="company">Загрузка…</h1>
          <div class="meta" id="meta"></div>
        </div>
        <div class="top-actions">
          <label class="switch" title="Показать закрытый эталон: ошибки, доказательства, историю изменений">
            <input type="checkbox" id="reviewer">
            <span class="track"><span class="thumb"></span></span>
            <span class="switch-label">Режим проверяющего</span>
          </label>
          <button class="icon-btn" id="theme-btn" title="Тема" aria-label="Переключить тему">
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </header>

      <div class="mode-banner" id="mode-banner"></div>
      <section class="stats" id="stats"></section>

      <nav class="tabs" id="tabs" role="tablist"></nav>
      <section class="view" id="view"></section>
    </main>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div id="drawer-title"></div>
        <button class="icon-btn" id="drawer-close" aria-label="Закрыть">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
