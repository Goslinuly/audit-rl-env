[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgym"
version = "1.0.0"
description = "Reproducible RL environment for AI financial audit agents (FinTech hackathon 2026)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

[tool.setuptools.packages.find]
include = ["auditgym*"]

[tool.setuptools.package-data]
"auditgym.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
